name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offensivex
          POSTGRES_PASSWORD: offensivex
          POSTGRES_DB: offensivex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U offensivex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      # Fresh database: proves the whole chain applies, that the models and the
      # migrations agree (`alembic check` fails on drift), and that the
      # downgrade path works and re-upgrades cleanly.
      - name: Migrations - upgrade, drift check, downgrade, re-upgrade
        env:
          OFFENSIVEX_DATABASE_URL: postgresql+psycopg://offensivex:offensivex@localhost:5433/offensivex
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Unit + integration tests
        env:
          OFFENSIVEX_DATABASE_URL: postgresql+psycopg://offensivex:offensivex@localhost:5433/offensivex
          OFFENSIVEX_TEST_DATABASE_URL: postgresql+psycopg://offensivex:offensivex@localhost:5433/offensivex
        # Real-LLM tests are excluded by pytest's addopts and never run in CI;
        # no LLM credentials are configured here.
        run: pytest --cov=src/offensivex --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
