[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offensivex"
version = "0.0.0.dev0"
description = "OffensiveX backend — see docs/architecture/implementation-summary.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "structlog>=24.4,<25.0",
  # ADR-012: argon2id password hashing.
  "argon2-cffi>=23.1,<26",
  # LLM providers (offensivex.llm.providers): the official Anthropic SDK, and
  # httpx for the OpenAI-compatible chat-completions provider.
  "anthropic>=0.40,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
offensivex = "offensivex.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
]
# Optional ML advisory layer (ADR-026). Pinned to the versions the artifacts were
# trained with: a scikit-learn major.minor mismatch makes the loader refuse them.
ml = [
  "scikit-learn==1.6.1",
  "numpy==2.1.3",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "joblib==1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Real-LLM tests cost money: never part of a default run. `pytest -m real_llm`
# (a later -m wins over this one) opts in.
addopts = "-m 'not real_llm'"
markers = [
  "integration: requires a real PostgreSQL instance (see docker-compose.yml)",
  "real_llm: opt-in; calls a real LLM provider (needs OFFENSIVEX_LLM_* configured, costs money)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert + hardcoded test-only secrets are fine
# Regex literals ported verbatim from the training notebooks (ADR-026): wrapping them
# risks changing a pattern the models were trained against.
"src/offensivex/ml_advisory/features.py" = ["E501"]
# S108/S603/S607: this file shells out to the `docker` CLI (a fixed,
# literal argv, never untrusted input) and asserts against /tmp paths
# *inside* ephemeral sandbox containers, not the host filesystem — both
# are false positives for Bandit's usual host-process/host-path concerns.
"tests/integration/test_phase4_sandbox.py" = ["S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
