[alembic]
script_location = migrations
prepend_sys_path = . src
path_separator = os
version_path_separator = os

# No sqlalchemy.url here, deliberately: the database URL comes from
# OffensiveX's own Settings (OFFENSIVEX_DATABASE_URL), read in
# migrations/env.py, so there is exactly one place a connection string is
# assembled and no secret-bearing URL is ever committed to this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
